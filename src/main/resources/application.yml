spring:
  application:
    name: training-service
  jpa:
    hibernate:
      show-sql: false
      format-sql: true
      physical-strategy: org.example.persistence.config.SnakeCasePhysicalNamingStrategy
  activemq:
    broker-url: ${SPRING_ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
    user: admin
    password: admin
    packages:
      trust-all: true
  redelivery:
    maximum-redeliveries: 3
    initial-redelivery-delay: 1000
    use-exponential-back-off: true
    back-off-multiplier: 2.0

  jms:
    listener:
      session:
        acknowledge-mode: client


app:
  queue:
    workload: workload.queue

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  observations:
    key-values:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      workloadService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      workloadService:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.jms.JmsException
          - java.io.IOException