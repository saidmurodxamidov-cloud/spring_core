
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'gym-management-system'


scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']


  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'

    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'gym-management-system'
          environment: 'local'

    scrape_interval: 30s


    scrape_timeout: 10s

